# Deploy docs/ (utilities landing, plotter, pyJuxta walkthrough) to GitHub Pages.
# The pyJuxta walkthrough runs the library in the browser, so the wheel and data manifest it loads
# are built here (they are not committed).
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pyjuxta/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pyJuxta site assets
        run: python pyjuxta/tools/build_site_assets.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
