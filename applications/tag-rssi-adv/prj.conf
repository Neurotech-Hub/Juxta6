# HIL: connectionless dual-antenna advertising RSSI (no CS / RAS / nrf_dm)
CONFIG_GPIO=y

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="JX_TAG"
CONFIG_BT_MAX_CONN=1
# Identity advertising uses the public/static address in the AD.
CONFIG_BT_EXT_ADV=n

# SoftDevice Controller: request +8 dBm at the antenna (nRF54L15 max;
# hardware clamps to nearest supported level).
CONFIG_BT_CTLR_TX_PWR_ANTENNA=8

# Field use without a debugger draining RTT (snippet rtt-console).
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
