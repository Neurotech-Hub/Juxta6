sample:
  name: Tag RSSI Adv Dual-Antenna
  description: >
    HIL: connectionless advertiser/scanner roles (BTN1). TX +8 dBm. Scanner
    matches juxta6-0-prod dual-antenna burst (500 ms×2); RTT one max-RSSI line
    per peer per burst; LED green if any peer else blue. No CS/RAS.

common:
  tags:
    - tag
    - bringup
    - bluetooth
    - rssi

tests:
  applications.tag-rssi-adv:
    platform_allow:
      - nrf54l15tag/nrf54l15/cpuapp
    harness: console
