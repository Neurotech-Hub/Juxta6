# MCUboot image for juxta6-0-prod (nRF54L15 Tag).
# Unsigned images for local lab / Device Manager DFU (same policy as Juxta 5.8).
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Minimal bootloader: do not pull app peripherals (VDD ADC, external SPI NOR).
CONFIG_ADC=n
CONFIG_SPI=n
CONFIG_SPI_NOR=n
CONFIG_SENSOR=n
CONFIG_I2C=n

# nRF54 MCUboot typically needs a larger main stack; MPU fault if undersized.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_FPROTECT=n

CONFIG_FLASH=y
CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_MULTITHREADING=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_MINIMAL_LIBC=y
