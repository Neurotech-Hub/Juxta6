# juxta6-0-prod M2: Hublink + dual-ant RSSI + live vitals + MX25L3233 NOR CSV
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y
# In-tree ADXL367 driver off: the app builds the vendored copy in
# lib/juxta_adxl367/ (identical except no motion-sensitive boot self-test).
CONFIG_ADXL367=n
CONFIG_BME680=y
CONFIG_BMI270=y
CONFIG_PM_DEVICE=y
CONFIG_HWINFO=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y

# Field survival: hard faults reboot instead of halting forever, and a
# hardware watchdog (wdt31, 60 s) catches silent hangs. Fed from all
# long-lived loops in main.c and from juxta_log's long-erase tick.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_WATCHDOG=y

# RTT must never block in the field (no debugger attached to drain it).
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# GATT client required for bt_gatt_exchange_mtu() (iOS long writes).
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="JX_TAG"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
# Advertise preferred conn params in GAP (iOS reads before explicit update).
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_EXT_ADV=n
CONFIG_BT_HCI_ERR_TO_STR=y
CONFIG_BT_RX_STACK_SIZE=6144

# Hublink transfer / Node JSON envelope (default ATT MTU is too small).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=0
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n

# External SPI NOR (MX25L3233) + internal NVS settings.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# 8 x 4 KB sectors (36 KB storage partition): the juxta/log_cache blob is
# ~2.3 KB at JUXTA_MAX_FILES=72, so 4 sectors left no GC headroom.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_CRC=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
