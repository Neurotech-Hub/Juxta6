# HIL: MX25L3233F deep power-down (runtime PM) isolation test for juxta6-0-prod.
# Mirrors the prod NOR/PM configuration; see README.md.
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_PM_DEVICE=y
# Control build (rpm_off.conf) sets this to n. Driver default
# CONFIG_SPI_NOR_ACTIVE_DWELL_MS=10 is intentionally kept, same as prod.
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=4096
